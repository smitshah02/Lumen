# Lumen — Postgres 16 + pgvector
#
#   docker compose up -d
#   python -m src.storage.schema     # creates extensions, tables, HNSW + GIN indexes
#
# Host port is 5434. Copy .env.example to .env, keep DATABASE_URL and
# LUMEN_PG_PASSWORD aligned, and explicitly select the persistent volume.

services:
  db:
    image: pgvector/pgvector:0.8.6-pg16-bookworm@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    container_name: lumen-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${LUMEN_PG_PASSWORD:?Set LUMEN_PG_PASSWORD to match DATABASE_URL}
      POSTGRES_DB: lumen
      # Deterministic FTS behaviour — BM25 ranks on to_tsvector('english', ...)
      # in a GENERATED column, so the server's collation must not drift.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    ports:
      - "${LUMEN_PG_PORT:-5434}:5432"
    volumes:
      - lumen_pgdata:/var/lib/postgresql/data
    # Defaults are too small to build HNSW indexes over note_chunks without
    # spilling to disk. maintenance_work_mem is the one that matters at index
    # build time; work_mem covers the RRF-sized sorts at query time.
    command:
      - postgres
      - -c
      - shared_buffers=1GB
      - -c
      - work_mem=64MB
      - -c
      - maintenance_work_mem=2GB
      - -c
      - max_parallel_maintenance_workers=4
      - -c
      - effective_cache_size=4GB
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d lumen"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  # External on purpose: `docker compose down -v` can never delete it.
  # No opaque default: select an existing volume deliberately, or create the
  # documented clean-install volume first. See docs/database-lifecycle.md.
  lumen_pgdata:
    external: true
    name: ${LUMEN_PG_VOLUME:?Set LUMEN_PG_VOLUME to an existing external volume}
